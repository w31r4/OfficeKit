<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://appsforoffice.microsoft.com; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://appsforoffice.microsoft.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OfficeKit PowerPoint</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/officekit-powerpoint-80.png" alt="" width="40" height="40" />
        <div><h1>OfficeKit</h1><p>PowerPoint Live</p></div>
      </header>
      <section id="setup" class="card">
        <p id="setup-copy">Waiting for PowerPoint…</p>
        <button id="connect" type="button" disabled>Connect OfficeKit</button>
      </section>
      <section id="session" class="card" hidden>
        <dl>
          <div><dt>Presentation</dt><dd id="presentation-name">—</dd></div>
          <div><dt>Session</dt><dd id="session-id">—</dd></div>
        </dl>
        <p id="connection-status">Connected</p>
        <div class="buttons"><button id="refresh" type="button">Refresh</button><button id="disconnect" type="button">Disconnect</button></div>
      </section>
      <section class="card"><h2>Diagnostics</h2><pre id="diagnostics-output">—</pre></section>
      <section class="card"><h2>Audit</h2><pre id="audit-output">No operation yet.</pre></section>
    </main>
    <script src="taskpane.js" type="text/javascript"></script>
  </body>
</html>
