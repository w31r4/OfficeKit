name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow is deliberately the fast developer gate. Provider downloads,
# native template round trips, PromptBench, and full WASM/release validation
# live in ci-slow.yml so a small source or Skill change gets prompt feedback.
jobs:
  fast:
    name: Fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
