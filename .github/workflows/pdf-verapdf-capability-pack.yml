name: veraPDF PDF capability pack

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the immutable veraPDF plus managed-JRE release only after both platform probes pass"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# This release-only lane builds a bundled JRE for the one selected veraPDF
# runtime. Normal npm install, root import, and ordinary tests never download
# a JRE, installer, or capability pack.
permissions:
  contents: write
  attestations: write
  artifact-metadata: write
  id-token: write

env:
  # `oat.1` is immutable for macOS and Linux. A Windows-capable release is
  # rebuilt and verified on all three platforms before its catalog pins move.
  VERAPDF_PACK_VERSION: 1.30.2-oat.2
  VERAPDF_INPUTS: scripts/pdf-provider-verapdf-release-inputs.v1.json

jobs:
  verapdf-pack:
    name: veraPDF (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: darwin-arm64
            runner: macos-14
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate pinned veraPDF and JRE inputs
        run: node scripts/build-verapdf-provider-pack.mjs --verify-lock
      - name: Compile the capability-pack-owned Windows Java launcher
        if: ${{ matrix.platform == 'win32-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ build tools are unavailable.' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $launcher = Join-Path $env:RUNNER_TEMP 'office-kit-verapdf-launcher.exe'
          cmd.exe /d /s /c "call `"$devcmd`" -arch=x64 -host_arch=x64 >nul && cl.exe /nologo /O2 /MT /W4 /DUNICODE /D_UNICODE /Fe`"$launcher`" scripts\windows-java-jar-launcher.c /link /SUBSYSTEM:CONSOLE"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'Windows Java launcher compilation failed.' }
      - name: Assemble a self-contained veraPDF CLI pack
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            node scripts/build-verapdf-provider-pack.mjs \
              --pack verapdf \
              --version "$VERAPDF_PACK_VERSION" \
              --platform "${{ matrix.platform }}" \
              --output "$RUNNER_TEMP/verapdf-release" \
              --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$VERAPDF_INPUTS" \
              --windows-launcher "$RUNNER_TEMP/office-kit-verapdf-launcher.exe"
          else
            node scripts/build-verapdf-provider-pack.mjs \
              --pack verapdf \
              --version "$VERAPDF_PACK_VERSION" \
              --platform "${{ matrix.platform }}" \
              --output "$RUNNER_TEMP/verapdf-release" \
              --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$VERAPDF_INPUTS"
          fi
      - name: Verify the extracted managed runtime and real conformance adapter
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/verapdf-release/verapdf-$VERAPDF_PACK_VERSION-${{ matrix.platform }}.tar.gz"
          destination="$RUNNER_TEMP/verapdf-consumer"
          mkdir -p "$RUNNER_TEMP/verapdf-home"
          node scripts/verify-pdf-provider-pack.mjs \
            --archive "$archive" \
            --manifest "$RUNNER_TEMP/verapdf-release/verapdf-$VERAPDF_PACK_VERSION-${{ matrix.platform }}.manifest.json" \
            --destination "$destination"
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            test -f "$destination/bin/verapdf.exe"
            test -f "$destination/jre/bin/java.exe"
            launcher="$destination/bin/verapdf.exe"
          else
            test -x "$destination/bin/verapdf"
            test -x "$destination/jre/bin/java"
            launcher="$destination/bin/verapdf"
          fi
          test -f "$destination/libexec/bin/cli-1.30.2.jar"
          test -d "$destination/jre/legal"
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            launcher_windows="$(cygpath -w "$launcher")"
            powershell.exe -NoProfile -NonInteractive -Command "\$ErrorActionPreference = 'Stop'; \$env:JAVA_TOOL_OPTIONS = ''; \$env:JDK_JAVA_OPTIONS = ''; \$env:_JAVA_OPTIONS = ''; \$env:CLASSPATH = ''; & '${launcher_windows}' --version" | grep -Fx 'veraPDF 1.30.2'
            powershell.exe -NoProfile -NonInteractive -Command "\$ErrorActionPreference = 'Stop'; & '${launcher_windows}' --list" | grep -Eq '^[[:space:]]+ua2[[:space:]]+-'
            # Pass the native launcher path through PowerShell so Git Bash
            # cannot rewrite its drive-letter form before the Python adapter
            # receives it. The prior inline Bash assignment made Python try
            # to execute a POSIX-looking path and fail with WinError 193.
            powershell.exe -NoProfile -NonInteractive -Command "\$ErrorActionPreference = 'Stop'; \$env:OFFICE_KIT_PDF_VERAPDF_TEST = '${launcher_windows}'; \$env:OFFICE_KIT_PDF_VERAPDF_TEST_PYTHON = (Get-Command python.exe -ErrorAction Stop).Source; & node.exe test/pdf-verapdf-provider.mjs; if (\$LASTEXITCODE -ne 0) { exit \$LASTEXITCODE }"
          else
            env -i HOME="$RUNNER_TEMP/verapdf-home" PATH="$destination/bin:/usr/bin:/bin" "$launcher" --version | grep -Fx 'veraPDF 1.30.2'
            env -i HOME="$RUNNER_TEMP/verapdf-home" PATH="$destination/bin:/usr/bin:/bin" "$launcher" --list | grep -Eq '^[[:space:]]+ua2[[:space:]]+-'
            OFFICE_KIT_PDF_VERAPDF_TEST="$launcher" node test/pdf-verapdf-provider.mjs
          fi
      - name: Attest immutable veraPDF pack provenance
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/verapdf-release/*.tar.gz
      - name: Attest veraPDF pack SBOM
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/verapdf-release/verapdf-${{ env.VERAPDF_PACK_VERSION }}-${{ matrix.platform }}.tar.gz
          sbom-path: ${{ runner.temp }}/verapdf-release/verapdf-${{ env.VERAPDF_PACK_VERSION }}-${{ matrix.platform }}.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: verapdf-${{ matrix.platform }}
          path: ${{ runner.temp }}/verapdf-release/
          if-no-files-found: error
          retention-days: 14

  release-verapdf-pack:
    name: assemble veraPDF release manifest
    needs: verapdf-pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          pattern: verapdf-*
          path: ${{ runner.temp }}/verapdf-platforms
          merge-multiple: true
      - name: Combine audited platform manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-verapdf-$VERAPDF_PACK_VERSION"
          release_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/"
          node scripts/finalize-pdf-provider-release.mjs \
            --pack verapdf \
            --version "$VERAPDF_PACK_VERSION" \
            --input "$RUNNER_TEMP/verapdf-platforms" \
            --output "$RUNNER_TEMP/verapdf-final" \
            --release-base-url "$release_base" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/pdf-verapdf-capability-pack.yml \
            --expected-platforms darwin-arm64,linux-x64,win32-x64
          jq -e '.catalogFragment.state == "published" and (.catalogFragment.artifacts | length == 3)' "$RUNNER_TEMP/verapdf-final/verapdf-$VERAPDF_PACK_VERSION.release-manifest.json"
      - name: Attest veraPDF release evidence assets
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/verapdf-final/*
      - uses: actions/upload-artifact@v4
        with:
          name: verapdf-release-manifest
          path: ${{ runner.temp }}/verapdf-final/
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable GitHub release assets
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-verapdf-$VERAPDF_PACK_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to mutate existing release $tag" >&2
            exit 2
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "PDF capability pack: veraPDF $VERAPDF_PACK_VERSION" \
            --notes "Hash-pinned veraPDF CLI plus managed JRE capability pack. The npm catalog does not advertise these assets until a reviewed catalog update pins their exact hashes. Verify every asset with: gh attestation verify <asset> --repo $GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/verapdf-platforms"/* "$RUNNER_TEMP/verapdf-final"/*
