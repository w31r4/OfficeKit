name: Poppler QA PDF capability pack

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the immutable Windows Poppler QA release after its isolated consumer probe passes"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# This lane has one deliberately narrow initial target: the signed Windows x64
# QA closure. A future all-platform Poppler release must use a new immutable
# version; it must not append a different platform to this release tag.
# Normal npm installs, root imports, and ordinary tests never download it.
permissions:
  contents: write
  attestations: write
  artifact-metadata: write
  id-token: write

env:
  POPPLER_INPUTS: scripts/pdf-provider-poppler-release-inputs.v1.json
  POPPLER_PACK_VERSION: 24.08.0-oat.1

jobs:
  poppler-qa:
    name: Poppler QA (win32-x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate immutable Poppler release inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-poppler-native-payload.mjs --verify-lock
          jq -e '
            .schema == "office-kit.pdf-provider-poppler-release-inputs.v1" and
            .schemaVersion == 1 and
            .popplerQa.packId == "poppler-qa" and
            .popplerQa.version == "24.08.0-oat.1" and
            (.popplerQa.nativeBuild["win32-x64"].sha256 | test("^[a-f0-9]{64}$")) and
            (.popplerQa.nativeBuild["win32-x64"].licenseRelativePath == "share/poppler/COPYING.gpl2") and
            (.popplerQa.nativeBuild["win32-x64"].licenseSha256 | test("^[a-f0-9]{64}$"))
          ' "$POPPLER_INPUTS"
      - name: Download and assemble the isolated Windows Poppler closure
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/poppler-source"
          source_zip="$RUNNER_TEMP/poppler-windows.zip"
          payload="$RUNNER_TEMP/poppler-qa-payload"
          notices="$RUNNER_TEMP/poppler-qa-native-notices.md"
          mkdir -p "$source_root" "$payload"
          source_url="$(jq -r '.popplerQa.nativeBuild["win32-x64"].url' "$POPPLER_INPUTS")"
          source_sha="$(jq -r '.popplerQa.nativeBuild["win32-x64"].sha256' "$POPPLER_INPUTS")"
          source_bytes="$(jq -r '.popplerQa.nativeBuild["win32-x64"].downloadBytes' "$POPPLER_INPUTS")"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$source_url" --output "$source_zip"
          test "$(wc -c < "$source_zip" | tr -d ' ')" = "$source_bytes"
          test "$(node scripts/sha256-file.mjs "$source_zip")" = "$source_sha"
          export OFFICEKIT_POPPLER_SOURCE_ZIP="$(cygpath -w "$source_zip")"
          export OFFICEKIT_POPPLER_SOURCE_ROOT="$(cygpath -w "$source_root")"
          powershell.exe -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            Expand-Archive -LiteralPath $env:OFFICEKIT_POPPLER_SOURCE_ZIP -DestinationPath $env:OFFICEKIT_POPPLER_SOURCE_ROOT -Force
          '
          archive_root="$(jq -r '.popplerQa.nativeBuild["win32-x64"].root' "$POPPLER_INPUTS")"
          bin_relative="$(jq -r '.popplerQa.nativeBuild["win32-x64"].binRelativePath' "$POPPLER_INPUTS")"
          data_relative="$(jq -r '.popplerQa.nativeBuild["win32-x64"].dataRelativePath' "$POPPLER_INPUTS")"
          bin_root="$source_root/$archive_root/$bin_relative"
          data_root="$source_root/$archive_root/$data_relative"
          test -d "$bin_root"
          test -d "$data_root"
          node scripts/build-poppler-native-payload.mjs \
            --platform win32-x64 \
            --payload "$payload" \
            --bin-root "$bin_root" \
            --data-root "$data_root" \
            --notices "$notices"
          license_relative="$(jq -r '.popplerQa.nativeBuild["win32-x64"].licenseRelativePath' "$POPPLER_INPUTS")"
          license_sha="$(jq -r '.popplerQa.nativeBuild["win32-x64"].licenseSha256' "$POPPLER_INPUTS")"
          license_bytes="$(jq -r '.popplerQa.nativeBuild["win32-x64"].licenseBytes' "$POPPLER_INPUTS")"
          license_file="$source_root/$archive_root/$license_relative"
          test -f "$license_file"
          test "$(wc -c < "$license_file" | tr -d ' ')" = "$license_bytes"
          test "$(node scripts/sha256-file.mjs "$license_file")" = "$license_sha"
          {
            cat "$notices"
            printf '\n# Source provenance\n\n'
            printf '%s\n' "Upstream Windows source: $source_url"
            printf '%s\n' "SHA-256: $source_sha"
            printf '\n# Poppler GPL-2.0-or-later\n\n'
            cat "$license_file"
            printf '\n# Upstream source-distribution notices\n'
            while IFS= read -r notice; do
              printf '\n## %s\n\n' "$(basename "$notice")"
              cat "$notice"
            done < <(find "$data_root" -maxdepth 1 -type f \( -name 'COPYING' -o -name 'COPYING.adobe' -o -name 'NOTICE*' \) -print | LC_ALL=C sort)
          } > "$RUNNER_TEMP/poppler-qa-notices.md"
          node scripts/build-pdf-provider-pack.mjs \
            --pack poppler-qa \
            --version "$POPPLER_PACK_VERSION" \
            --platform win32-x64 \
            --payload "$payload" \
            --output "$RUNNER_TEMP/poppler-qa-release" \
            --source-url "$source_url" \
            --source-sha256 "$source_sha" \
            --license GPL-2.0-or-later \
            --notices "$RUNNER_TEMP/poppler-qa-notices.md"
      - name: Verify the extracted QA pack under a system-only PATH
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/poppler-qa-release/poppler-qa-$POPPLER_PACK_VERSION-win32-x64.tar.gz"
          destination="$RUNNER_TEMP/poppler-qa-consumer"
          node scripts/verify-pdf-provider-pack.mjs \
            --archive "$archive" \
            --manifest "$RUNNER_TEMP/poppler-qa-release/poppler-qa-$POPPLER_PACK_VERSION-win32-x64.manifest.json" \
            --destination "$destination"
          for executable in pdfinfo.exe pdftoppm.exe pdftotext.exe; do test -f "$destination/bin/$executable"; done
          for command in pdfinfo.exe pdftoppm.exe pdftotext.exe; do
            command_windows="$(cygpath -w "$destination/bin/$command")"
            powershell.exe -NoProfile -NonInteractive -Command "\$ErrorActionPreference = 'Stop'; \$env:Path = [System.IO.Path]::Combine(\$env:SystemRoot, 'System32'); & '${command_windows}' -v" 2>&1 | grep -qi poppler
          done
      - name: Attest immutable Poppler QA pack provenance
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-release/*.tar.gz
      - name: Attest Poppler QA pack SBOM
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-release/poppler-qa-${{ env.POPPLER_PACK_VERSION }}-win32-x64.tar.gz
          sbom-path: ${{ runner.temp }}/poppler-qa-release/poppler-qa-${{ env.POPPLER_PACK_VERSION }}-win32-x64.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: poppler-qa-win32-x64
          path: ${{ runner.temp }}/poppler-qa-release/
          if-no-files-found: error
          retention-days: 14

  release-poppler-qa:
    name: assemble Windows Poppler QA release manifest
    needs: poppler-qa
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          name: poppler-qa-win32-x64
          path: ${{ runner.temp }}/poppler-qa-platforms
      - name: Combine audited Windows manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-poppler-qa-$POPPLER_PACK_VERSION"
          node scripts/finalize-pdf-provider-release.mjs \
            --pack poppler-qa \
            --version "$POPPLER_PACK_VERSION" \
            --input "$RUNNER_TEMP/poppler-qa-platforms" \
            --output "$RUNNER_TEMP/poppler-qa-final" \
            --release-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/pdf-poppler-capability-pack.yml \
            --expected-platforms win32-x64
          jq -e '.catalogFragment.state == "published" and (.catalogFragment.artifacts | length == 1) and .catalogFragment.artifacts[0].platform == "win32-x64"' "$RUNNER_TEMP/poppler-qa-final/poppler-qa-$POPPLER_PACK_VERSION.release-manifest.json"
      - name: Attest Windows Poppler QA release evidence
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-final/*
      - uses: actions/upload-artifact@v4
        with:
          name: poppler-qa-release-manifest
          path: ${{ runner.temp }}/poppler-qa-final/
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable Windows Poppler QA release assets
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-poppler-qa-$POPPLER_PACK_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to mutate existing release $tag" >&2
            exit 2
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "PDF capability pack: Windows Poppler QA $POPPLER_PACK_VERSION" --notes "Hash-pinned Windows Poppler pdfinfo, pdftoppm, and pdftotext QA pack. The npm catalog does not advertise this release until a reviewed digest-pinning update and managed-platform acceptance. Verify assets with: gh attestation verify <asset> --repo $GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/poppler-qa-platforms"/* "$RUNNER_TEMP/poppler-qa-final"/*
