name: Poppler QA PDF capability pack

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the immutable cross-platform Poppler QA release after every isolated consumer probe passes"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# The release is built from the same hash-pinned Poppler source on macOS/Linux
# and the reviewed upstream Windows closure. Every platform is independently
# extracted and probed before the immutable release manifest is assembled.
# Normal npm installs, root imports, and ordinary tests never download it.
permissions:
  contents: write
  attestations: write
  artifact-metadata: write
  id-token: write

env:
  POPPLER_INPUTS: scripts/pdf-provider-poppler-release-inputs.v1.json
  POPPLER_PACK_VERSION: 24.08.0-oat.2

jobs:
  poppler-qa:
    name: Poppler QA (win32-x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate immutable Poppler release inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-poppler-native-payload.mjs --verify-lock
          jq -e '
            .schema == "office-kit.pdf-provider-poppler-release-inputs.v1" and
            .schemaVersion == 1 and
            .popplerQa.packId == "poppler-qa" and
            .popplerQa.version == "24.08.0-oat.2" and
            (.popplerQa.nativeBuild["win32-x64"].sha256 | test("^[a-f0-9]{64}$")) and
            (.popplerQa.nativeBuild["win32-x64"].licenseRelativePath == "share/poppler/COPYING.gpl2") and
            (.popplerQa.nativeBuild["win32-x64"].licenseSha256 | test("^[a-f0-9]{64}$"))
          ' "$POPPLER_INPUTS"
      - name: Download and assemble the isolated Windows Poppler closure
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/poppler-source"
          source_zip="$RUNNER_TEMP/poppler-windows.zip"
          payload="$RUNNER_TEMP/poppler-qa-payload"
          notices="$RUNNER_TEMP/poppler-qa-native-notices.md"
          mkdir -p "$source_root" "$payload"
          source_url="$(jq -r '.popplerQa.nativeBuild["win32-x64"].url' "$POPPLER_INPUTS")"
          source_sha="$(jq -r '.popplerQa.nativeBuild["win32-x64"].sha256' "$POPPLER_INPUTS")"
          source_bytes="$(jq -r '.popplerQa.nativeBuild["win32-x64"].downloadBytes' "$POPPLER_INPUTS")"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$source_url" --output "$source_zip"
          test "$(wc -c < "$source_zip" | tr -d ' ')" = "$source_bytes"
          test "$(node scripts/sha256-file.mjs "$source_zip")" = "$source_sha"
          export OFFICEKIT_POPPLER_SOURCE_ZIP="$(cygpath -w "$source_zip")"
          export OFFICEKIT_POPPLER_SOURCE_ROOT="$(cygpath -w "$source_root")"
          powershell.exe -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            Expand-Archive -LiteralPath $env:OFFICEKIT_POPPLER_SOURCE_ZIP -DestinationPath $env:OFFICEKIT_POPPLER_SOURCE_ROOT -Force
          '
          archive_root="$(jq -r '.popplerQa.nativeBuild["win32-x64"].root' "$POPPLER_INPUTS")"
          bin_relative="$(jq -r '.popplerQa.nativeBuild["win32-x64"].binRelativePath' "$POPPLER_INPUTS")"
          data_relative="$(jq -r '.popplerQa.nativeBuild["win32-x64"].dataRelativePath' "$POPPLER_INPUTS")"
          bin_root="$source_root/$archive_root/$bin_relative"
          data_root="$source_root/$archive_root/$data_relative"
          test -d "$bin_root"
          test -d "$data_root"
          node scripts/build-poppler-native-payload.mjs \
            --platform win32-x64 \
            --payload "$payload" \
            --bin-root "$bin_root" \
            --data-root "$data_root" \
            --notices "$notices"
          license_relative="$(jq -r '.popplerQa.nativeBuild["win32-x64"].licenseRelativePath' "$POPPLER_INPUTS")"
          license_sha="$(jq -r '.popplerQa.nativeBuild["win32-x64"].licenseSha256' "$POPPLER_INPUTS")"
          license_bytes="$(jq -r '.popplerQa.nativeBuild["win32-x64"].licenseBytes' "$POPPLER_INPUTS")"
          license_file="$source_root/$archive_root/$license_relative"
          test -f "$license_file"
          test "$(wc -c < "$license_file" | tr -d ' ')" = "$license_bytes"
          test "$(node scripts/sha256-file.mjs "$license_file")" = "$license_sha"
          {
            cat "$notices"
            printf '\n# Source provenance\n\n'
            printf '%s\n' "Upstream Windows source: $source_url"
            printf '%s\n' "SHA-256: $source_sha"
            printf '\n# Poppler GPL-2.0-or-later\n\n'
            cat "$license_file"
            printf '\n# Upstream source-distribution notices\n'
            while IFS= read -r notice; do
              printf '\n## %s\n\n' "$(basename "$notice")"
              cat "$notice"
            done < <(find "$data_root" -maxdepth 1 -type f \( -name 'COPYING' -o -name 'COPYING.adobe' -o -name 'NOTICE*' \) -print | LC_ALL=C sort)
          } > "$RUNNER_TEMP/poppler-qa-notices.md"
          node scripts/build-pdf-provider-pack.mjs \
            --pack poppler-qa \
            --version "$POPPLER_PACK_VERSION" \
            --platform win32-x64 \
            --payload "$payload" \
            --output "$RUNNER_TEMP/poppler-qa-release" \
            --source-url "$source_url" \
            --source-sha256 "$source_sha" \
            --license GPL-2.0-or-later \
            --notices "$RUNNER_TEMP/poppler-qa-notices.md"
      - name: Verify the extracted QA pack under a system-only PATH
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/poppler-qa-release/poppler-qa-$POPPLER_PACK_VERSION-win32-x64.tar.gz"
          destination="$RUNNER_TEMP/poppler-qa-consumer"
          node scripts/verify-pdf-provider-pack.mjs \
            --archive "$archive" \
            --manifest "$RUNNER_TEMP/poppler-qa-release/poppler-qa-$POPPLER_PACK_VERSION-win32-x64.manifest.json" \
            --destination "$destination"
          for executable in pdfinfo.exe pdftoppm.exe pdftotext.exe; do test -f "$destination/bin/$executable"; done
          for command in pdfinfo.exe pdftoppm.exe pdftotext.exe; do
            command_windows="$(cygpath -w "$destination/bin/$command")"
            powershell.exe -NoProfile -NonInteractive -Command "\$ErrorActionPreference = 'Stop'; \$env:Path = [System.IO.Path]::Combine(\$env:SystemRoot, 'System32'); & '${command_windows}' -v" 2>&1 | grep -qi poppler
          done
      - name: Attest immutable Poppler QA pack provenance
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-release/*.tar.gz
      - name: Attest Poppler QA pack SBOM
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-release/poppler-qa-${{ env.POPPLER_PACK_VERSION }}-win32-x64.tar.gz
          sbom-path: ${{ runner.temp }}/poppler-qa-release/poppler-qa-${{ env.POPPLER_PACK_VERSION }}-win32-x64.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: poppler-qa-win32-x64
          path: ${{ runner.temp }}/poppler-qa-release/
          if-no-files-found: error
          retention-days: 14

  poppler-posix:
    name: Poppler QA (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned Poppler build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              cmake g++ pkg-config patchelf \
              libfontconfig1-dev libfreetype6-dev libjpeg-dev libpng-dev \
              libopenjp2-7-dev liblcms2-dev zlib1g-dev
          else
            brew install cmake pkg-config fontconfig freetype jpeg-turbo libpng little-cms2 openjpeg
          fi
      - name: Download and verify the hash-pinned Poppler source
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(jq -r '.popplerQa.source.url' "$POPPLER_INPUTS")"
          source_sha="$(jq -r '.popplerQa.source.sha256' "$POPPLER_INPUTS")"
          source_bytes="$(jq -r '.popplerQa.source.downloadBytes' "$POPPLER_INPUTS")"
          mkdir -p "$RUNNER_TEMP/poppler-source"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$source_url" --output "$RUNNER_TEMP/poppler-source/source.tar.xz"
          test "$(wc -c < "$RUNNER_TEMP/poppler-source/source.tar.xz" | tr -d ' ')" = "$source_bytes"
          test "$(node scripts/sha256-file.mjs "$RUNNER_TEMP/poppler-source/source.tar.xz")" = "$source_sha"
          tar -xJf "$RUNNER_TEMP/poppler-source/source.tar.xz" -C "$RUNNER_TEMP/poppler-source"
      - name: Build Poppler QA commands from the pinned source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/poppler-source/poppler-$(jq -r '.popplerQa.source.version' "$POPPLER_INPUTS")"
          build_dir="$RUNNER_TEMP/poppler-build"
          install_dir="$RUNNER_TEMP/poppler-install"
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX="$install_dir"
            -DENABLE_UTILS=ON
            -DENABLE_CPP=OFF
            -DENABLE_GLIB=OFF
            -DENABLE_QT5=OFF
            -DENABLE_QT6=OFF
            -DENABLE_CAIRO=OFF
            -DENABLE_LIBCURL=OFF
            -DENABLE_GPGME=OFF
            -DENABLE_NSS3=OFF
            -DENABLE_BOOST=OFF
            -DENABLE_LIBTIFF=OFF
            -DBUILD_CPP_TESTS=OFF
            -DENABLE_LIBOPENJPEG=openjpeg2
          )
          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            cmake_args+=(-DCMAKE_OSX_ARCHITECTURES=arm64)
          fi
          cmake -S "$source_dir" -B "$build_dir" "${cmake_args[@]}"
          cmake --build "$build_dir" --parallel
          cmake --install "$build_dir"
          test -x "$install_dir/bin/pdfinfo"
          test -x "$install_dir/bin/pdftoppm"
          test -x "$install_dir/bin/pdftotext"
          mkdir -p "$RUNNER_TEMP/poppler-payload" "$RUNNER_TEMP/poppler-notices"
          source_url="$(jq -r '.popplerQa.source.url' "$POPPLER_INPUTS")"
          source_sha="$(jq -r '.popplerQa.source.sha256' "$POPPLER_INPUTS")"
          {
            printf '%s\n\n' '# Poppler native capability-pack notices'
            printf '%s\n\n' "Source archive: $source_url"
            printf '%s\n\n' "Source SHA-256: $source_sha"
            cat "$source_dir/COPYING"
            if [ -f "$source_dir/COPYING3" ]; then cat "$source_dir/COPYING3"; fi
          } > "$RUNNER_TEMP/poppler-notices/source.md"
          library_args=()
          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            # The builder follows only these declared formula roots.  It then
            # resolves the transitive closure by basename and refuses any
            # unresolved build-machine path.
            for dep in $(brew deps --installed --include-build fontconfig freetype jpeg-turbo libpng little-cms2 openjpeg); do
              dep_prefix="$(brew --prefix "$dep" 2>/dev/null || true)"
              if [ -n "$dep_prefix" ] && [ -d "$dep_prefix/lib" ]; then library_args+=(--library-root "$dep_prefix/lib"); fi
            done
          else
            library_args+=(--library-root /usr/lib/x86_64-linux-gnu)
          fi
          node scripts/build-poppler-portable-payload.mjs \
            --platform "${{ matrix.platform }}" \
            --payload "$RUNNER_TEMP/poppler-payload" \
            --pdfinfo "$install_dir/bin/pdfinfo" \
            --pdftoppm "$install_dir/bin/pdftoppm" \
            --pdftotext "$install_dir/bin/pdftotext" \
            --data-root "$install_dir/share/poppler" \
            --notices "$RUNNER_TEMP/poppler-notices/source.md" \
            --version "$(jq -r '.popplerQa.source.version' "$POPPLER_INPUTS")" \
            --source-url "$source_url" --source-sha256 "$source_sha" \
            "${library_args[@]}"
          node scripts/build-pdf-provider-pack.mjs \
            --pack poppler-qa \
            --version "$POPPLER_PACK_VERSION" \
            --platform "${{ matrix.platform }}" \
            --payload "$RUNNER_TEMP/poppler-payload" \
            --output "$RUNNER_TEMP/poppler-qa-release" \
            --source-url "$source_url" \
            --source-sha256 "$source_sha" \
            --license GPL-2.0-or-later \
            --notices "$RUNNER_TEMP/poppler-notices/source.md"
      - name: Verify the extracted POSIX Poppler closure
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/poppler-qa-release/poppler-qa-$POPPLER_PACK_VERSION-${{ matrix.platform }}.tar.gz"
          destination="$RUNNER_TEMP/poppler-qa-consumer"
          node scripts/verify-pdf-provider-pack.mjs \
            --archive "$archive" \
            --manifest "$RUNNER_TEMP/poppler-qa-release/poppler-qa-$POPPLER_PACK_VERSION-${{ matrix.platform }}.manifest.json" \
            --destination "$destination"
          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            export DYLD_LIBRARY_PATH="$destination/lib"
          else
            export LD_LIBRARY_PATH="$destination/lib"
          fi
          export POPPLER_DATADIR="$destination/share/poppler"
          "$destination/bin/pdfinfo" -v 2>&1 | grep -F "Poppler"
          "$destination/bin/pdftoppm" -v 2>&1 | grep -F "Poppler"
          "$destination/bin/pdftotext" -v 2>&1 | grep -F "Poppler"
          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            ! otool -L "$destination/bin/pdfinfo" | grep -E '/opt/homebrew/|/usr/local/'
          else
            ! readelf -d "$destination/bin/pdfinfo" | grep -E '/usr/local/|/opt/'
          fi
      - name: Attest immutable POSIX Poppler QA pack provenance
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-release/*.tar.gz
      - name: Attest POSIX Poppler QA pack SBOM
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-release/poppler-qa-${{ env.POPPLER_PACK_VERSION }}-${{ matrix.platform }}.tar.gz
          sbom-path: ${{ runner.temp }}/poppler-qa-release/poppler-qa-${{ env.POPPLER_PACK_VERSION }}-${{ matrix.platform }}.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: poppler-${{ matrix.platform }}
          path: ${{ runner.temp }}/poppler-qa-release/
          if-no-files-found: error
          retention-days: 14

  release-poppler-qa:
    name: assemble cross-platform Poppler QA release manifest
    needs: [poppler-qa, poppler-posix]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          pattern: poppler-*
          path: ${{ runner.temp }}/poppler-qa-platforms
          merge-multiple: true
      - name: Combine audited platform manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-poppler-qa-$POPPLER_PACK_VERSION"
          node scripts/finalize-pdf-provider-release.mjs \
            --pack poppler-qa \
            --version "$POPPLER_PACK_VERSION" \
            --input "$RUNNER_TEMP/poppler-qa-platforms" \
            --output "$RUNNER_TEMP/poppler-qa-final" \
            --release-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/pdf-poppler-capability-pack.yml \
            --expected-platforms darwin-arm64,linux-x64,win32-x64
          jq -e '.catalogFragment.state == "published" and (.catalogFragment.artifacts | length == 3)' "$RUNNER_TEMP/poppler-qa-final/poppler-qa-$POPPLER_PACK_VERSION.release-manifest.json"
      - name: Attest cross-platform Poppler QA release evidence
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/poppler-qa-final/*
      - uses: actions/upload-artifact@v4
        with:
          name: poppler-qa-release-manifest
          path: ${{ runner.temp }}/poppler-qa-final/
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable cross-platform Poppler QA release assets
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-poppler-qa-$POPPLER_PACK_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to mutate existing release $tag" >&2
            exit 2
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "PDF capability pack: Poppler QA $POPPLER_PACK_VERSION" --notes "Hash-pinned Poppler pdfinfo, pdftoppm, and pdftotext QA packs for macOS arm64, Linux x64, and Windows x64. Verify assets with: gh attestation verify <asset> --repo $GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/poppler-qa-platforms"/* "$RUNNER_TEMP/poppler-qa-final"/*
