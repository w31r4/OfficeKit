name: OCR PDF capability packs

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create immutable OCR core and language-pack releases only after every platform probe passes"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# This is a release-only lane. Normal npm installation, root import, and test
# runs never download OCR engines, language models, Python, or native tools.
permissions:
  contents: write
  attestations: write
  artifact-metadata: write
  id-token: write

env:
  OCR_INPUTS: scripts/pdf-provider-ocr-release-inputs.v1.json
  PYTHON_INPUTS: scripts/pdf-provider-python-release-inputs.v1.json
  # `oat.1` is immutable for macOS and Linux. Windows support receives fresh
  # all-platform releases after its native closure has passed real probes.
  OCR_CORE_PACK_VERSION: 17.8.1-oat.2
  OCR_LANGUAGE_PACK_VERSION: 4.1.0-oat.2

jobs:
  ocr-core:
    name: OCR core (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            # Jammy ships Tesseract 4.1, while the shipped OCR provider
            # deliberately accepts only the Tesseract 5.x contract.
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-14
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate pinned OCR and Python inputs
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema == "office-kit.pdf-provider-ocr-release-inputs.v1" and
            .schemaVersion == 1 and
            .ocrCore.packId == "ocr-core" and
            .ocrCore.version == "17.8.1-oat.2" and
            (.ocrCore.nativeBuild["win32-x64"].tesseract.sha256 | test("^[a-f0-9]{64}$")) and
            (.ocrCore.nativeBuild["win32-x64"].ghostscript.sha256 | test("^[a-f0-9]{64}$")) and
            (.ocrCore.nativeBuild["win32-x64"].poppler.sha256 | test("^[a-f0-9]{64}$")) and
            (.languages.eng.sha256 | test("^[a-f0-9]{64}$")) and
            (.languages.chi_sim.sha256 | test("^[a-f0-9]{64}$")) and
            (.licenseMaterial.tessdataFastApache20.sha256 | test("^[a-f0-9]{64}$")) and
            (.licenseMaterial.windowsNative.tesseractApache20.sha256 | test("^[a-f0-9]{64}$")) and
            (.licenseMaterial.windowsNative.ghostscriptAgpl30.sha256 | test("^[a-f0-9]{64}$")) and
            (.licenseMaterial.windowsNative.popplerGpl20.sha256 | test("^[a-f0-9]{64}$"))
          ' "$OCR_INPUTS"
          test "$(node scripts/sha256-file.mjs "$PYTHON_INPUTS")" = "$(jq -r '.ocrCore.pythonInputs.sha256' "$OCR_INPUTS")"
          node scripts/build-python-provider-pack.mjs --verify-lock
      - name: Install platform-native OCR build inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng ghostscript poppler-utils poppler-data libgs-common fonts-droid-fallback fonts-urw-base35 patchelf
          elif [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            brew install tesseract ghostscript poppler
          else
            # Windows inputs are downloaded from the immutable lock below and
            # installed only under RUNNER_TEMP. No package manager or global
            # Python is part of the customer-runtime closure.
            for command in curl cygpath powershell.exe; do command -v "$command"; done
          fi
      - name: Compile capability-pack-owned Windows OCR launchers
        if: ${{ matrix.platform == 'win32-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ build tools are unavailable.' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $pythonLauncher = Join-Path $env:RUNNER_TEMP 'office-kit-ocrmypdf-launcher.exe'
          $ghostscriptLauncher = Join-Path $env:RUNNER_TEMP 'office-kit-ghostscript-launcher.exe'
          # A generated batch file keeps the Visual Studio path and both
          # output paths quoted through the cmd.exe boundary.  Passing a
          # nested quoted command string directly from PowerShell is fragile
          # when the hosted image changes its Program Files layout.
          $buildScript = Join-Path $env:RUNNER_TEMP 'office-kit-build-ocr-launchers.cmd'
          @"
          @echo off
          call "$devcmd" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /O2 /MT /W4 /DUNICODE /D_UNICODE /Fe"$pythonLauncher" scripts\windows-python-module-launcher.c /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /O2 /MT /W4 /DUNICODE /D_UNICODE /Fe"$ghostscriptLauncher" scripts\windows-ghostscript-launcher.c /link /SUBSYSTEM:CONSOLE
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $buildScript -Encoding ascii
          & $buildScript
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $pythonLauncher -PathType Leaf) -or -not (Test-Path -LiteralPath $ghostscriptLauncher -PathType Leaf)) { throw 'Windows OCR launcher compilation failed.' }
      - name: Build isolated OCRmyPDF Python payload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-python-provider-pack.mjs \
            --pack ocr-core \
            --version "$OCR_CORE_PACK_VERSION" \
            --platform "${{ matrix.platform }}" \
            --output "$RUNNER_TEMP/ocr-python" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$PYTHON_INPUTS"
      - name: Add relocatable native OCR sidecars
        shell: bash
        run: |
          set -euo pipefail
          python_archive="$RUNNER_TEMP/ocr-python/ocr-core-$OCR_CORE_PACK_VERSION-${{ matrix.platform }}.tar.gz"
          payload="$RUNNER_TEMP/ocr-payload"
          node scripts/verify-pdf-provider-pack.mjs \
            --archive "$python_archive" \
            --manifest "$RUNNER_TEMP/ocr-python/ocr-core-$OCR_CORE_PACK_VERSION-${{ matrix.platform }}.manifest.json" \
            --destination "$payload"
          mv "$payload/THIRD_PARTY_NOTICES.md" "$RUNNER_TEMP/ocr-python-notices.md"
          rm "$payload/sbom.cdx.json"
          native_notices="$RUNNER_TEMP/ocr-native-notices.md"
          library_args=()
          poppler_args=()
          resource_args=()
          resource_packages=()
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            # The Ghostscript Resource tree contains package-managed CMap,
            # CID fallback, and base-font links. Keep every external target
            # inside this explicit apt-owned allowlist; the pack builder then
            # dereferences only those roots into regular files.
            resource_packages=(libgs-common poppler-data fonts-droid-fallback fonts-urw-base35)
            tessdata_root="$(dirname "$(dpkg -L tesseract-ocr-eng | awk '/eng\.traineddata$/ { print; exit }')")"
            test -d "$tessdata_root"
            ghostscript_resource="$(find /usr/share/ghostscript -type d -name Resource -print -quit)"
            test -d "$ghostscript_resource"
            resource_roots=()
            used_resource_packages=()
            append_unique() {
              local value="$1"
              shift
              local existing
              for existing in "$@"; do
                if [ "$existing" = "$value" ]; then return 0; fi
              done
              return 1
            }
            record_resource_owner() {
              local candidate="$1"
              local owner=""
              local package
              for package in "${resource_packages[@]}"; do
                if dpkg-query -S "$candidate" 2>/dev/null | cut -d: -f1 | tr ',' '\n' | grep -Fxq "$package"; then
                  owner="$package"
                  break
                fi
              done
              if [ -z "$owner" ]; then
                printf 'unapproved Ghostscript resource target: %s\n' "$candidate" >&2
                return 1
              fi
              if ! append_unique "$owner" "${used_resource_packages[@]}"; then used_resource_packages+=("$owner"); fi
            }
            record_resource_root() {
              local candidate="$1"
              local root="$2"
              if ! append_unique "$root" "${resource_roots[@]}"; then resource_roots+=("$root"); fi
              record_resource_owner "$candidate"
            }
            while IFS= read -r resource_link; do
              resource_target="$(readlink -f "$resource_link")"
              test -e "$resource_target"
              case "$resource_target" in "$ghostscript_resource"/*) continue ;; esac
              if [ -d "$resource_target" ]; then
                # `Resource/CMap` is a directory symlink on Ubuntu. The
                # directory itself and every resolved leaf must be owned by
                # our declared package set before it may become a trusted
                # resource root.
                if ! append_unique "$(dirname "$resource_target")" "${resource_roots[@]}"; then resource_roots+=("$(dirname "$resource_target")"); fi
                resource_files=0
                while IFS= read -r resource_file; do
                  resource_files=1
                  # `find -L` reports the link's spelling. Record the
                  # resolved leaf instead so treeCopy receives the actual
                  # external Poppler/apt root rather than only the CMap link
                  # directory that contains it.
                  resource_actual="$(readlink -f "$resource_file")"
                  test -f "$resource_actual"
                  record_resource_root "$resource_actual" "$(dirname "$resource_actual")"
                done < <(find -L "$resource_target" -type f -print | LC_ALL=C sort)
                if [ "$resource_files" = 0 ]; then record_resource_root "$resource_target" "$(dirname "$resource_target")"; fi
              else
                record_resource_root "$resource_target" "$(dirname "$resource_target")"
              fi
            done < <(find "$ghostscript_resource" -type l -print | LC_ALL=C sort)
            for resource_root in "${resource_roots[@]}"; do resource_args+=(--resource-root "$resource_root"); done
            for package in "${resource_packages[@]}"; do
              test -r "/usr/share/doc/$package/copyright"
              dpkg-query -W -f='${Package} ${Version}\n' "$package" > "$RUNNER_TEMP/$package-package.txt"
            done
            library_args+=(--library-root /usr/lib/x86_64-linux-gnu)
            if [ -d /usr/share/poppler ]; then poppler_args+=(--poppler-root /usr/share/poppler); fi
            node scripts/build-ocr-native-payload.mjs \
              --platform linux-x64 \
              --payload "$payload" \
              --notices "$native_notices" \
              --tesseract /usr/bin/tesseract \
              --ghostscript /usr/bin/gs \
              --pdftotext /usr/bin/pdftotext \
              --ghostscript-root /usr/share/ghostscript \
              --tessdata-root "$tessdata_root" \
              "${resource_args[@]}" \
              "${poppler_args[@]}" \
              "${library_args[@]}"
          elif [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            # A one-formula `brew deps` invocation on an installed formula
            # reports its actual runtime closure. Calling it separately keeps
            # the union without switching to the declared (and incomplete)
            # dependency graph that a multi-formula invocation would use.
            formulae=(tesseract ghostscript poppler)
            while IFS= read -r formula; do
              if [ -n "$formula" ]; then formulae+=("$formula"); fi
            done < <(for root_formula in tesseract ghostscript poppler; do brew deps "$root_formula"; done | LC_ALL=C sort -u)
            for formula in "${formulae[@]}"; do
              prefix="$(brew --prefix "$formula")"
              if [ -d "$prefix/lib" ]; then library_args+=(--library-root "$prefix/lib"); fi
            done
            node scripts/build-ocr-native-payload.mjs \
              --platform darwin-arm64 \
              --payload "$payload" \
              --notices "$native_notices" \
              --tesseract "$(brew --prefix tesseract)/bin/tesseract" \
              --ghostscript "$(brew --prefix ghostscript)/bin/gs" \
              --pdftotext "$(brew --prefix poppler)/bin/pdftotext" \
              --ghostscript-root "$(brew --prefix ghostscript)/share/ghostscript" \
              --poppler-root "$(brew --prefix poppler)/share/poppler" \
              --tessdata-root "$(brew --prefix tesseract)/share/tessdata" \
              "${library_args[@]}"
          else
            # Every Windows source is an exact URL/byte/hash from the audited
            # input lock. The installers are run only inside RUNNER_TEMP;
            # `build-ocr-native-payload` then dereferences their native DLL
            # closure into the pack and the consumer probe below has no access
            # to these build directories.
            windows_sources="$RUNNER_TEMP/ocr-windows-sources"
            tesseract_install="$RUNNER_TEMP/ocr-tesseract-install"
            ghostscript_install="$RUNNER_TEMP/ocr-ghostscript-install"
            poppler_extract="$RUNNER_TEMP/ocr-poppler-extract"
            mkdir -p "$windows_sources" "$tesseract_install" "$ghostscript_install" "$poppler_extract"
            fetch_locked() {
              local selector="$1"
              local target="$2"
              local url sha bytes
              url="$(jq -r "$selector.url" "$OCR_INPUTS")"
              sha="$(jq -r "$selector.sha256" "$OCR_INPUTS")"
              bytes="$(jq -r "$selector.downloadBytes" "$OCR_INPUTS")"
              curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$url" --output "$target"
              test "$(wc -c < "$target" | tr -d ' ')" = "$bytes"
              test "$(node scripts/sha256-file.mjs "$target")" = "$sha"
            }
            fetch_locked '.ocrCore.nativeBuild["win32-x64"].tesseract' "$windows_sources/tesseract.exe"
            fetch_locked '.ocrCore.nativeBuild["win32-x64"].ghostscript' "$windows_sources/ghostscript.exe"
            fetch_locked '.ocrCore.nativeBuild["win32-x64"].poppler' "$windows_sources/poppler.zip"
            export OFFICEKIT_TESSERACT_INSTALLER="$(cygpath -w "$windows_sources/tesseract.exe")"
            export OFFICEKIT_TESSERACT_INSTALL_ROOT="$(cygpath -w "$tesseract_install")"
            export OFFICEKIT_GHOSTSCRIPT_INSTALLER="$(cygpath -w "$windows_sources/ghostscript.exe")"
            export OFFICEKIT_GHOSTSCRIPT_INSTALL_ROOT="$(cygpath -w "$ghostscript_install")"
            export OFFICEKIT_POPPLER_ARCHIVE="$(cygpath -w "$windows_sources/poppler.zip")"
            export OFFICEKIT_POPPLER_EXTRACT_ROOT="$(cygpath -w "$poppler_extract")"
            export OFFICEKIT_WINDOWS_PATHS="$(cygpath -w "$RUNNER_TEMP/ocr-windows-paths.json")"
            powershell.exe -NoProfile -NonInteractive -Command '
              $ErrorActionPreference = "Stop"
              foreach ($pair in @(
                @($env:OFFICEKIT_TESSERACT_INSTALLER, $env:OFFICEKIT_TESSERACT_INSTALL_ROOT),
                @($env:OFFICEKIT_GHOSTSCRIPT_INSTALLER, $env:OFFICEKIT_GHOSTSCRIPT_INSTALL_ROOT)
              )) {
                $process = Start-Process -FilePath $pair[0] -ArgumentList @("/S", "/D=$($pair[1])") -Wait -PassThru
                if ($process.ExitCode -ne 0) { throw "native installer failed with exit $($process.ExitCode): $($pair[0])" }
              }
              Expand-Archive -LiteralPath $env:OFFICEKIT_POPPLER_ARCHIVE -DestinationPath $env:OFFICEKIT_POPPLER_EXTRACT_ROOT -Force
              $tesseract = Get-ChildItem -LiteralPath $env:OFFICEKIT_TESSERACT_INSTALL_ROOT -Recurse -File -Filter tesseract.exe | Select-Object -First 1
              $ghostscript = Get-ChildItem -LiteralPath $env:OFFICEKIT_GHOSTSCRIPT_INSTALL_ROOT -Recurse -File -Filter gswin64c.exe | Select-Object -First 1
              $popplerRootName = (Get-Content -Raw $env:OCR_INPUTS | ConvertFrom-Json).ocrCore.nativeBuild."win32-x64".poppler.root
              $popplerRoot = Join-Path $env:OFFICEKIT_POPPLER_EXTRACT_ROOT $popplerRootName
              $pdftotext = Join-Path $popplerRoot "Library\\bin\\pdftotext.exe"
              $popplerShare = Join-Path $popplerRoot "share\\poppler"
              if (-not $tesseract -or -not $ghostscript -or -not (Test-Path -LiteralPath $pdftotext -PathType Leaf) -or -not (Test-Path -LiteralPath $popplerShare -PathType Container)) { throw "Windows native OCR install did not expose the expected Tesseract, Ghostscript, or Poppler layout." }
              $tesseractBin = $tesseract.Directory.FullName
              $tessdata = Join-Path $tesseractBin "tessdata"
              if (-not (Test-Path -LiteralPath $tessdata -PathType Container)) {
                $tessdata = Join-Path (Split-Path -Parent $tesseractBin) "tessdata"
              }
              $ghostscriptRoot = Split-Path -Parent $ghostscript.Directory.FullName
              if (-not (Test-Path -LiteralPath $tessdata -PathType Container) -or -not (Test-Path -LiteralPath (Join-Path $ghostscriptRoot "Resource") -PathType Container) -or -not (Test-Path -LiteralPath (Join-Path $ghostscriptRoot "lib") -PathType Container)) { throw "Windows native OCR resources are incomplete." }
              $pathsJson = @{ tesseract = $tesseract.FullName; tesseractRoot = $tesseractBin; tessdata = $tessdata; ghostscript = $ghostscript.FullName; ghostscriptRoot = $ghostscriptRoot; ghostscriptBin = $ghostscript.Directory.FullName; pdftotext = $pdftotext; popplerBin = Split-Path -Parent $pdftotext; popplerShare = $popplerShare } | ConvertTo-Json -Compress
              [System.IO.File]::WriteAllText($env:OFFICEKIT_WINDOWS_PATHS, $pathsJson, [System.Text.UTF8Encoding]::new($false))
            '
            windows_paths="$RUNNER_TEMP/ocr-windows-paths.json"
            library_args+=(--library-root "$(jq -r '.tesseractRoot' "$windows_paths")")
            library_args+=(--library-root "$(jq -r '.ghostscriptBin' "$windows_paths")")
            library_args+=(--library-root "$(jq -r '.popplerBin' "$windows_paths")")
            node scripts/build-ocr-native-payload.mjs \
              --platform win32-x64 \
              --payload "$payload" \
              --notices "$native_notices" \
              --tesseract "$(jq -r '.tesseract' "$windows_paths")" \
              --ghostscript "$(jq -r '.ghostscript' "$windows_paths")" \
              --pdftotext "$(jq -r '.pdftotext' "$windows_paths")" \
              --ghostscript-root "$(jq -r '.ghostscriptRoot' "$windows_paths")" \
              --poppler-root "$(jq -r '.popplerShare' "$windows_paths")" \
              --tessdata-root "$(jq -r '.tessdata' "$windows_paths")" \
              --windows-python-launcher "$RUNNER_TEMP/office-kit-ocrmypdf-launcher.exe" \
              --windows-ghostscript-launcher "$RUNNER_TEMP/office-kit-ghostscript-launcher.exe" \
              "${library_args[@]}"
            fetch_locked '.licenseMaterial.windowsNative.tesseractApache20' "$RUNNER_TEMP/tesseract-LICENSE.txt"
            fetch_locked '.licenseMaterial.windowsNative.ghostscriptAgpl30' "$RUNNER_TEMP/ghostscript-AGPL-3.0.txt"
            fetch_locked '.licenseMaterial.windowsNative.popplerGpl20' "$RUNNER_TEMP/poppler-GPL-2.0.txt"
          fi
          {
            cat "$RUNNER_TEMP/ocr-python-notices.md"
            printf '\n\n# Native OCR sidecars\n\n'
            cat "$native_notices"
            if [ "${{ matrix.platform }}" = "linux-x64" ]; then
              for package in "${resource_packages[@]}"; do
                printf '\n\n## %s build input\n\n' "$package"
                cat "$RUNNER_TEMP/$package-package.txt"
                printf '\n'
                cat "/usr/share/doc/$package/copyright"
              done
            elif [ "${{ matrix.platform }}" = "win32-x64" ]; then
              printf '\n\n## Windows native source locks\n\n'
              jq -r '.ocrCore.nativeBuild["win32-x64"] | to_entries[] | "- \(.key): \(.value.url) (sha256:\(.value.sha256))"' "$OCR_INPUTS"
              printf '\n\n### Tesseract Apache-2.0\n\n'
              cat "$RUNNER_TEMP/tesseract-LICENSE.txt"
              printf '\n\n### Ghostscript GNU AGPL-3.0-or-later\n\n'
              cat "$RUNNER_TEMP/ghostscript-AGPL-3.0.txt"
              printf '\n\n### Poppler GPL-2.0-or-later\n\n'
              cat "$RUNNER_TEMP/poppler-GPL-2.0.txt"
              printf '\n\n### Poppler source-distribution notices\n\n'
              while IFS= read -r notice; do
                printf '\n#### %s\n\n' "$(basename "$notice")"
                cat "$notice"
              done < <(find "$(jq -r '.popplerShare' "$windows_paths")" -maxdepth 1 -type f \( -name 'COPYING*' -o -name 'NOTICE*' \) -print | LC_ALL=C sort)
            fi
          } > "$RUNNER_TEMP/ocr-notices.md"
          inputs_sha="$(node scripts/sha256-file.mjs "$OCR_INPUTS")"
          node scripts/build-pdf-provider-pack.mjs \
            --pack ocr-core \
            --version "$OCR_CORE_PACK_VERSION" \
            --platform "${{ matrix.platform }}" \
            --payload "$payload" \
            --output "$RUNNER_TEMP/ocr-core-release" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$OCR_INPUTS" \
            --source-sha256 "$inputs_sha" \
            --license "$(jq -r '.ocrCore.license' "$OCR_INPUTS")" \
            --notices "$RUNNER_TEMP/ocr-notices.md"
      - name: Verify extracted OCR core is self-contained and language-free
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ocr-core-release/ocr-core-$OCR_CORE_PACK_VERSION-${{ matrix.platform }}.tar.gz"
          destination="$RUNNER_TEMP/ocr-core-consumer"
          home="$RUNNER_TEMP/ocr-home"
          mkdir -p "$home"
          node scripts/verify-pdf-provider-pack.mjs \
            --archive "$archive" \
            --manifest "$RUNNER_TEMP/ocr-core-release/ocr-core-$OCR_CORE_PACK_VERSION-${{ matrix.platform }}.manifest.json" \
            --destination "$destination"
          test ! -e "$destination/bin/pip"
          test -z "$(find "$destination/share/tessdata" -type f -name '*.traineddata' -print -quit)"
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            for executable in ocrmypdf.exe tesseract.exe gs.exe gswin64c.exe pdftotext.exe; do test -f "$destination/bin/$executable"; done
            run_probe() {
              local name="$1"
              local launcher="$2"
              shift 2
              local output="$RUNNER_TEMP/$name-version.txt"
              local launcher_windows
              launcher_windows="$(cygpath -w "$launcher")"
              if ! powershell.exe -NoProfile -NonInteractive -Command "\$ErrorActionPreference = 'Stop'; \$env:Path = [System.IO.Path]::Combine(\$env:SystemRoot, 'System32'); \$env:PYTHONHOME = 'ambient'; \$env:PYTHONPATH = 'ambient'; & '${launcher_windows}' $*" > "$output" 2>&1; then
                cat "$output" >&2
                return 1
              fi
              printf '%s\n' "$output"
            }
            ocrmypdf_version="$(run_probe ocrmypdf "$destination/bin/ocrmypdf.exe" --version)"
            tesseract_version="$(run_probe tesseract "$destination/bin/tesseract.exe" --version)"
            ghostscript_version="$(run_probe ghostscript "$destination/bin/gs.exe" --version)"
            pdftotext_version="$(run_probe pdftotext "$destination/bin/pdftotext.exe" -v)"
          else
            for executable in ocrmypdf tesseract gs pdftotext; do test -x "$destination/bin/$executable"; done
            run_probe() {
              local name="$1"
              shift
              local output="$RUNNER_TEMP/$name-version.txt"
              if ! env -i HOME="$home" PATH="$destination/bin:/usr/bin:/bin" "$@" > "$output" 2>&1; then
                cat "$output" >&2
                return 1
              fi
              printf '%s\n' "$output"
            }
            ocrmypdf_version="$(run_probe ocrmypdf "$destination/bin/ocrmypdf" --version)"
            tesseract_version="$(run_probe tesseract "$destination/bin/tesseract" --version)"
            ghostscript_version="$(run_probe ghostscript "$destination/bin/gs" --version)"
            pdftotext_version="$(run_probe pdftotext "$destination/bin/pdftotext" -v)"
          fi
          grep -Fx 17.8.1 "$ocrmypdf_version" || { cat "$ocrmypdf_version" >&2; exit 2; }
          grep -q '^tesseract 5\.' "$tesseract_version" || { cat "$tesseract_version" >&2; exit 2; }
          grep -q '^[0-9]' "$ghostscript_version" || { cat "$ghostscript_version" >&2; exit 2; }
          grep -q 'Poppler' "$pdftotext_version" || { cat "$pdftotext_version" >&2; exit 2; }
      - name: Attest immutable OCR core provenance
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/ocr-core-release/*.tar.gz
      - name: Attest OCR core SBOM
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/ocr-core-release/ocr-core-${{ env.OCR_CORE_PACK_VERSION }}-${{ matrix.platform }}.tar.gz
          sbom-path: ${{ runner.temp }}/ocr-core-release/ocr-core-${{ env.OCR_CORE_PACK_VERSION }}-${{ matrix.platform }}.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-core-${{ matrix.platform }}
          path: ${{ runner.temp }}/ocr-core-release/
          if-no-files-found: error
          retention-days: 14

  ocr-language:
    name: OCR language ${{ matrix.language }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: eng
            pack: ocr-language-eng
            platform: linux-x64
            runner: ubuntu-22.04
          - language: eng
            pack: ocr-language-eng
            platform: darwin-arm64
            runner: macos-14
          - language: eng
            pack: ocr-language-eng
            platform: win32-x64
            runner: windows-2025
          - language: chi_sim
            pack: ocr-language-chi-sim
            platform: linux-x64
            runner: ubuntu-22.04
          - language: chi_sim
            pack: ocr-language-chi-sim
            platform: darwin-arm64
            runner: macos-14
          - language: chi_sim
            pack: ocr-language-chi-sim
            platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build a hash-pinned language-data pack
        shell: bash
        run: |
          set -euo pipefail
          language="${{ matrix.language }}"
          pack="${{ matrix.pack }}"
          url="$(jq -r --arg language "$language" '.languages[$language].url' "$OCR_INPUTS")"
          sha="$(jq -r --arg language "$language" '.languages[$language].sha256' "$OCR_INPUTS")"
          bytes="$(jq -r --arg language "$language" '.languages[$language].downloadBytes' "$OCR_INPUTS")"
          version="$(jq -r --arg language "$language" '.languages[$language].version' "$OCR_INPUTS")"
          license="$(jq -r --arg language "$language" '.languages[$language].license' "$OCR_INPUTS")"
          test "$version" = "$OCR_LANGUAGE_PACK_VERSION"
          payload="$RUNNER_TEMP/$pack-payload"
          mkdir -p "$payload/share/tessdata"
          data="$payload/share/tessdata/$language.traineddata"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$url" --output "$data"
          test "$(wc -c < "$data" | tr -d ' ')" = "$bytes"
          test "$(node scripts/sha256-file.mjs "$data")" = "$sha"
          license_url="$(jq -r '.licenseMaterial.tessdataFastApache20.url' "$OCR_INPUTS")"
          license_sha="$(jq -r '.licenseMaterial.tessdataFastApache20.sha256' "$OCR_INPUTS")"
          license_bytes="$(jq -r '.licenseMaterial.tessdataFastApache20.downloadBytes' "$OCR_INPUTS")"
          license_file="$RUNNER_TEMP/tessdata-fast-LICENSE.txt"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$license_url" --output "$license_file"
          test "$(wc -c < "$license_file" | tr -d ' ')" = "$license_bytes"
          test "$(node scripts/sha256-file.mjs "$license_file")" = "$license_sha"
          {
            printf '%s\n\n' "# Tesseract $language language-data notice"
            printf '%s\n\n' "This immutable pack contains only tessdata_fast 4.1.0 $language.traineddata, downloaded from $url and SHA-256 verified before packaging."
            cat "$license_file"
          } > "$RUNNER_TEMP/$pack-notices.md"
          node scripts/build-pdf-provider-pack.mjs \
            --pack "$pack" \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --payload "$payload" \
            --output "$RUNNER_TEMP/$pack-release" \
            --source-url "$url" \
            --source-sha256 "$sha" \
            --license "$license" \
            --notices "$RUNNER_TEMP/$pack-notices.md"
      - name: Verify extracted language-data bytes
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.pack }}-release/${{ matrix.pack }}-$OCR_LANGUAGE_PACK_VERSION-${{ matrix.platform }}.tar.gz"
          destination="$RUNNER_TEMP/${{ matrix.pack }}-consumer"
          node scripts/verify-pdf-provider-pack.mjs \
            --archive "$archive" \
            --manifest "$RUNNER_TEMP/${{ matrix.pack }}-release/${{ matrix.pack }}-$OCR_LANGUAGE_PACK_VERSION-${{ matrix.platform }}.manifest.json" \
            --destination "$destination"
          test -f "$destination/share/tessdata/${{ matrix.language }}.traineddata"
          test "$(find "$destination/share/tessdata" -type f | wc -l | tr -d ' ')" = 1
      - name: Attest immutable OCR language-pack provenance
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/${{ matrix.pack }}-release/*.tar.gz
      - name: Attest OCR language-pack SBOM
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/${{ matrix.pack }}-release/${{ matrix.pack }}-${{ env.OCR_LANGUAGE_PACK_VERSION }}-${{ matrix.platform }}.tar.gz
          sbom-path: ${{ runner.temp }}/${{ matrix.pack }}-release/${{ matrix.pack }}-${{ env.OCR_LANGUAGE_PACK_VERSION }}-${{ matrix.platform }}.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pack }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.pack }}-release/
          if-no-files-found: error
          retention-days: 14

  release-ocr-core:
    name: assemble OCR core release manifest
    needs: ocr-core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          pattern: ocr-core-*
          path: ${{ runner.temp }}/ocr-core-platforms
          merge-multiple: true
      - name: Combine audited OCR core manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-ocr-core-$OCR_CORE_PACK_VERSION"
          node scripts/finalize-pdf-provider-release.mjs \
            --pack ocr-core \
            --version "$OCR_CORE_PACK_VERSION" \
            --input "$RUNNER_TEMP/ocr-core-platforms" \
            --output "$RUNNER_TEMP/ocr-core-final" \
            --release-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/pdf-ocr-capability-packs.yml \
            --expected-platforms darwin-arm64,linux-x64,win32-x64
          jq -e '.catalogFragment.state == "published" and (.catalogFragment.artifacts | length == 3)' "$RUNNER_TEMP/ocr-core-final/ocr-core-$OCR_CORE_PACK_VERSION.release-manifest.json"
      - name: Attest OCR core release evidence
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/ocr-core-final/*
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-core-release-manifest
          path: ${{ runner.temp }}/ocr-core-final/
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable OCR core release assets
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-ocr-core-$OCR_CORE_PACK_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to mutate existing release $tag" >&2
            exit 2
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "PDF capability pack: OCR core $OCR_CORE_PACK_VERSION" --notes "Hash-pinned OCRmyPDF, Tesseract, Ghostscript, and pdftotext core. Language data is separately released and must be explicitly authorized. The npm catalog does not advertise these assets until a reviewed digest-pinning update. Verify assets with: gh attestation verify <asset> --repo $GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/ocr-core-platforms"/* "$RUNNER_TEMP/ocr-core-final"/*

  release-ocr-language:
    name: assemble ${{ matrix.pack }} release manifest
    needs: ocr-language
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: eng
            pack: ocr-language-eng
          - language: chi_sim
            pack: ocr-language-chi-sim
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ matrix.pack }}-*
          path: ${{ runner.temp }}/${{ matrix.pack }}-platforms
          merge-multiple: true
      - name: Combine audited language manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-${{ matrix.pack }}-$OCR_LANGUAGE_PACK_VERSION"
          node scripts/finalize-pdf-provider-release.mjs \
            --pack "${{ matrix.pack }}" \
            --version "$OCR_LANGUAGE_PACK_VERSION" \
            --input "$RUNNER_TEMP/${{ matrix.pack }}-platforms" \
            --output "$RUNNER_TEMP/${{ matrix.pack }}-final" \
            --release-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/pdf-ocr-capability-packs.yml \
            --expected-platforms darwin-arm64,linux-x64,win32-x64
          jq -e '.catalogFragment.state == "published" and (.catalogFragment.artifacts | length == 3)' "$RUNNER_TEMP/${{ matrix.pack }}-final/${{ matrix.pack }}-$OCR_LANGUAGE_PACK_VERSION.release-manifest.json"
      - name: Attest OCR language release evidence
        if: ${{ inputs.publish == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/${{ matrix.pack }}-final/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pack }}-release-manifest
          path: ${{ runner.temp }}/${{ matrix.pack }}-final/
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable language-pack release assets
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pdf-provider-${{ matrix.pack }}-$OCR_LANGUAGE_PACK_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to mutate existing release $tag" >&2
            exit 2
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "PDF capability pack: ${{ matrix.pack }} $OCR_LANGUAGE_PACK_VERSION" --notes "Hash-pinned Tesseract ${{ matrix.language }} language data. It is installed only after explicit project policy authorization and is never a silent OCR fallback. Verify assets with: gh attestation verify <asset> --repo $GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/${{ matrix.pack }}-platforms"/* "$RUNNER_TEMP/${{ matrix.pack }}-final"/*
