name: release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish to npm after all gates pass"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  native-codecs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.128
      - run: npm ci
      - run: npm run build:office-kit -- --target ${{ matrix.target }}
      - name: Pack the native codec package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-npm"
          npm pack "./packages/office-kit-codec-${{ matrix.target }}" \
            --ignore-scripts --pack-destination "$RUNNER_TEMP/native-npm"
      - uses: actions/upload-artifact@v4
        with:
          name: office-kit-codec-${{ matrix.target }}
          path: ${{ runner.temp }}/native-npm/*.tgz
          if-no-files-found: error

  release:
    needs: native-codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.128
      - run: npm ci
      - name: Verify generated protocol and build the NativeAOT codec
        run: |
          npm run proto:check
          dotnet restore native/OfficeKit/OfficeKit.sln --locked-mode
          npm run build:office-kit -- --target linux-x64
      - name: Install Chromium and native render tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils
      - name: Verify render/runtime tools
        run: |
          node -e "const fs = require('fs'); const { chromium } = require('playwright'); if (!fs.existsSync(chromium.executablePath())) process.exit(1)"
          soffice --version
          pdftoppm -v
          pdfinfo -v
          dotnet --version
      # Keep each invocation below the hosted runner's single-command limit.
      # The local `npm run test:slow` entry remains the complete serial gate.
      - name: Run slow foundation segment
        run: npm run test:slow -- --segment foundation
      - name: Run slow presentation segment
        run: npm run test:slow -- --segment presentation
      - name: Run slow templates segment
        run: npm run test:slow -- --segment templates
      - name: Run slow officekit segment
        run: npm run test:slow -- --segment officekit
      - name: Run slow documents segment
        run: npm run test:slow -- --segment documents
      - name: Run slow pdf-packs segment
        run: npm run test:slow -- --segment pdf-packs
      - name: Run slow pdf-providers segment
        run: npm run test:slow -- --segment pdf-providers
      - name: Run slow pdf-specialists segment
        run: npm run test:slow -- --segment pdf-specialists
      - name: Run slow qa segment
        run: npm run test:slow -- --segment qa
      - name: Run slow release segment
        run: npm run test:slow -- --segment release
      - run: npm run docs:api
      - run: git diff --exit-code docs/api.md
      - run: npm run test:pack
      - run: dotnet test native/OfficeBridge
      - run: dotnet test native/OfficeKit/OfficeKit.sln --configuration Release --no-restore
      - name: Release check (dry run)
        if: ${{ inputs.publish_npm != 'true' }}
        run: node scripts/release-check.mjs --json --skip-network --skip-commands
      - name: Release check (publish)
        if: ${{ inputs.publish_npm == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-check.mjs --json --skip-commands
      - name: Compute version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create git tag
        if: ${{ inputs.publish_npm == 'true' }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists locally."
          else
            git tag "$tag"
          fi
          git push origin "$tag"
      - name: Create GitHub release
        if: ${{ inputs.publish_npm == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --title "office-kit $tag" --notes "Clean-room Office/PDF artifact toolkit release $tag."
          fi
      - uses: actions/download-artifact@v5
        if: ${{ inputs.publish_npm == 'true' }}
        with:
          pattern: office-kit-codec-*
          path: ${{ runner.temp }}/native-npm
          merge-multiple: true
      - name: Publish npm
        if: ${{ inputs.publish_npm == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          for archive in "$RUNNER_TEMP/native-npm"/*.tgz; do
            npm publish "$archive" --access public
          done
          npm publish --access public
